{% extends "base.html" %}
{% block content %}
<div class="panel center" style="margin-top:24px">
  <div style="font-size:40px">💬</div>
  <div class="h2" style="margin-top:6px">{{ post.user.nickname }}님의 카카오톡 ID</div>
  <div style="font-size:22px;font-weight:800;margin:6px 0 14px" id="kid">{{ post.user.kakao_talk_id }}</div>
  <button class="btn pink" onclick="navigator.clipboard.writeText(document.getElementById('kid').textContent.trim()).then(()=>this.textContent='복사했어요! 카카오톡에서 친구 추가하세요')">ID 복사하기</button>
  <p class="hint">“{{ settings.APP_NAME }}에서 [{{ post.title }}] 글 보고 연락드려요” 라고 보내면 좋아요.</p>
  <a href="/p/{{ post.id }}" class="btn ghost" style="margin-top:8px">글로 돌아가기</a>
</div>
<div class="panel small muted">⚠️ 선입금 요구, 외부 결제 링크, 지나치게 싼 가격은 사기일 수 있어요. 가능하면 안전한 방법(반값택배·직거래)을 이용하세요.</div>
{% endblock %}
